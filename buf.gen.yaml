version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      value: github.com/grpmsoft/emcp-go/grpc/typed/proto/mcppb;mcppb
plugins:
  - local: protoc-gen-go
    out: grpc/typed/proto/mcppb
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: grpc/typed/proto/mcppb
    opt: paths=source_relative
